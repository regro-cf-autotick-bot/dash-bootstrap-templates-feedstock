{% set name = "dash-bootstrap-templates" %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 46c182f724d1e69851e619cf5c686572432a48d78fb475b6fb530c3cbd1977a7

build:
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - flask
    - werkzeug
    - dash
    - dash-bootstrap-components >=1.0.0
    - dash-core-components >=1.3.1
    - dash-html-components >=1.0.1
    - dash-renderer >=1.2.4
    - dash-table >=4.0.0
    - numpy
    - importlib-resources >=5.1.0
    - importlib-metadata >=3.4.0

test:
  imports:
    - dash_bootstrap_templates
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/AnnMarieW/dash-bootstrap-templates
  summary: A collection of Plotly figure templates with a Bootstrap theme
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Anselmoo
